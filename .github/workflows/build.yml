name: Build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 26
      uses: actions/setup-node@v4
      with:
        node-version: 26.x
    - name: Setup pnpm
      uses: pnpm/action-setup@v6.1.1
      with:
        version: 12.20.0
        run_install: true
        cache: true

    - run: pnpm build
    - run: pnpm test

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: build/
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5.0.1
